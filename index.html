<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Smart cycling training app with intelligent route planning, training analytics, and seamless sync for Strava, Garmin, and Wahoo. Your complete bike training planner." />
    <meta name="keywords" content="cycling training app, smart cycling routes, bike training planner, cycling analytics, strava integration, garmin connect, wahoo sync" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tribos" />

    <title>tribos.studio - Smart Cycling Training App</title>

    <!-- Open Graph / Link Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.tribos.studio" />
    <meta property="og:title" content="tribos.studio - Smart Cycling Training App" />
    <meta property="og:description" content="Smart cycling training app with intelligent route planning, training analytics, and seamless sync for Strava, Garmin, and Wahoo." />
    <meta property="og:image" content="https://www.tribos.studio/og-image.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="tribos.studio - Smart Cycling Training App" />
    <meta name="twitter:description" content="Smart cycling training app with intelligent route planning, training analytics, and seamless sync for Strava, Garmin, and Wahoo." />
    <meta name="twitter:image" content="https://www.tribos.studio/og-image.svg" />

    <!-- Manifest for Add to Home Screen -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Preconnect to external services -->
    <link rel="preconnect" href="https://api.mapbox.com" />
    <link rel="preconnect" href="https://events.mapbox.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Archivo (UI/body) + Courier Prime (numbers, logs, the coach) + Covered
         By Your Grace (hand notes). Tribos Display — Archivo at 62% width, for
         headings and stamps — is self-hosted: see src/styles/global.css. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,100,400..700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Covered+By+Your+Grace&display=swap" rel="stylesheet" />

    <!-- Mapbox GL CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />

    <style>
      /* Critical CSS for initial load */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #FFFFFF;
      }

      #root {
        min-height: 100vh;
      }

      /* Initial loading state */
      .initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
      }

      .initial-loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #C8C8F4;
        border-top-color: #0A0A14;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .initial-loader-text {
        color: #5E5E6E;
        font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <script>
      // Kill legacy/stale service workers, but preserve our push-only SW (/sw.js)
      // See docs/postmortem-2026-03-13-cloudflare-pwa-outage.md
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) {
            // Keep our push-only SW, kill everything else
            if (reg.active && reg.active.scriptURL === location.origin + '/sw.js') return;
            reg.unregister();
          });
        });
      }
    </script>
    <div id="root">
      <div class="initial-loader">
        <div class="initial-loader-spinner"></div>
        <div class="initial-loader-text">Loading tribos.studio...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
